[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The service worker must never be served from a stale cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# The Netlify subdomain always sends visitors to the real domain.
[[redirects]]
  from = "https://wortflip.netlify.app/*"
  to = "https://wortflip.de/:splat"
  status = 301
  force = true
